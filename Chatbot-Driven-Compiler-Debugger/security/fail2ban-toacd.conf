# Fail2ban Filter & Jail Configuration for TOACD Security Layer
# Place filter in /etc/fail2ban/filter.d/toacd.conf
# Place jail section in /etc/fail2ban/jail.d/toacd.local

[Definition]
failregex = ^\[.*\] \[TOACD-BAN\] client=<HOST> reason=.*$
ignoreregex =

# --- Jail Configuration ---
# [toacd-security]
# enabled  = true
# port     = http,https,8501
# filter   = toacd
# logpath  = /app/security_audit.log
# maxretry = 3
# findtime = 300
# bantime  = 900
