# Nginx + ModSecurity + OWASP Core Rule Set (CRS) Reverse Proxy for TOACD
server {
    listen 80;
    server_name localhost;

    modsecurity on;
    modsecurity_rules_file /etc/modsecurity.d/include.conf;

    # Rate limiting zone (30 req/min per IP with burst of 10)
    limit_req_zone $binary_remote_addr zone=toacd_limit:10m rate=30r/m;

    location / {
        limit_req zone=toacd_limit burst=10 nodelay;
        proxy_pass http://toacd-app:8501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }
}
